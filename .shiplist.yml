# Written by DocSpring/docspring's api_clients/scripts/generate from api_clients/github_workflows/python/.shiplist.yml:
# change it there.
#
# The files the wheel may hold (https://github.com/DocSpring/shiplist). The release workflow builds it and fails if it
# has any other file.
version: 1
stages: [package]

remove_before:
  package:
    include:
      - '.*'
      - '.*/**'
      - 'docs/'
      - 'test/'
      - '*.md'
      - '*.txt'
      - 'LICENSE'
      - 'pyproject.toml'
      - 'setup.cfg'
      - 'setup.py'
      - 'tox.ini'

keep:
  include:
    - 'docspring/'

forbid:
  - '**/.env'
  - '**/.env.*'

# The wheel's metadata, which the build writes (the licence goes in it)
build_output:
  - 'docspring-*.dist-info/**'
